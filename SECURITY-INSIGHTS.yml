# OpenSSF Security Insights (https://github.com/ossf/security-insights-spec)
# Answers below describe summit as it is today - we update this file when
# reality changes, not to look good.

version: 1.0.0
date: 2026-10-25

project-lifecycle:
  stage: active
  main-maintainers:
    - pennacle-security
  bug-fixes-only: false

contribution-policy:
  accepts-pull-requests: true
  accepting-autogenerated-contributions: false
  contributing-policy: https://github.com/pennacle-security/.github/blob/main/CONTRIBUTING.md
  code-of-conduct: https://github.com/pennacle-security/.github/blob/main/CODE_OF_CONDUCT.md

project-documentation:
  documentation-availability: true
  documentation-links:
    - https://github.com/pennacle-security/summit/blob/main/README.md
    - https://pennacle-security.github.io/summit/

distribution-points:
  - https://github.com/pennacle-security/summit/releases
  - https://github.com/pennacle-security/summit

security-artifacts:
  threat-model:
    security-artifact: false
    comment: >
      The implicit threat model is documented in the README's anti-false-positive
      section: what the scanner trusts (responses from the scanned target), what it
      refuses to do (fetch private ranges, solve CAPTCHAs, probe hosts that cannot
      resolve). A formal threat model document is on the roadmap.

security-testing:
  - tool:
      name: pytest
      version: ">=8"
      rulesets:
        - https://github.com/pennacle-security/summit/tree/main/tests
    integration: true
    comment: >
      45 unit and integration tests, run on every push. The demo-scan smoke test
      gates detections (seeded issues must be found; a healthy control link must
      stay unreported). examples/evidence.py reproduces every README claim live.

security-policy:
  security-policy: https://github.com/pennacle-security/.github/blob/main/SECURITY.md

security-links:
  vulnerability-reporting: https://github.com/pennacle-security/.github/blob/main/SECURITY.md

governance:
  project-governance: >
    Maintained by Pennacle Security. Decisions land through PRs; the maintainer
    team reviews and squash-merges. Roadmap direction is discussed publicly in
    the Ideas discussion.

legal:
  license: https://github.com/pennacle-security/summit/blob/main/LICENSE
  license-name: MIT

project-availability:
  availability: true
