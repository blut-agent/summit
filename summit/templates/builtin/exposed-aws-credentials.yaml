id: exposed-aws-credentials
info:
  name: Exposed AWS credentials file
  severity: critical
  description: An AWS shared credentials file is downloadable and contains an access key pair.
  confidence: confirmed
  confidence-rule: 'HTTP 200 plus an AKIA-style access key id and its matching secret assignment'
  classification:
    cwe-id: CWE-538
  impact: An attacker can use the key pair to access AWS resources allowed by the associated IAM policy.
  remediation: Revoke the exposed key pair, remove the credentials file from the web root, and audit CloudTrail for use.
  tags: [exposure, secrets, aws]
requests:
  - method: GET
    path:
      - '{{BaseURL}}/.aws/credentials'
    matchers:
      - type: regex
        part: body
        regex: 'aws_access_key_id\s*=\s*AKIA[0-9A-Z]{16}'
      - type: word
        part: body
        words: ['aws_secret_access_key']
      - type: status
        status: [200]
    matchers-condition: and
