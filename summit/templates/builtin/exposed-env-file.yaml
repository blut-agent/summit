id: exposed-env-file
info:
  name: Exposed .env File
  severity: high
  description: The .env file containing credentials and configuration is accessible via HTTP.
  confidence: confirmed
  confidence-rule: 'HTTP 200 + content signature APP_KEY= or DB_PASSWORD= present in body - not just a 200 status'
  classification:
    cwe-id: CWE-538
  impact: Credentials and configuration readable by anyone with the URL.
  remediation: Remove the .env file from the web root and block access to dotfiles.
  tags: [exposure, config, files]
requests:
  - method: GET
    path: '{{BaseURL}}/.env'
    matchers:
      - type: word
        part: body
        words:
          - 'APP_KEY='
          - 'DB_PASSWORD='
        condition: or
      - type: status
        status: 200
    matchers-condition: and
