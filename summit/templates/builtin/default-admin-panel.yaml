id: default-admin-panel
info:
  name: Admin panel login page reachable
  severity: medium
  description: A login form that looks like an administrative panel is reachable from the internet. Default credentials are common on such panels; summit does not guess them.
  confidence: needs-manual
  confidence-rule: 'HTTP 200 + password field + admin marker - verify default or weak credentials manually'
  classification:
    cwe-id: CWE-1188
  impact: If default or weak credentials work, full administrative access is available.
  remediation: Remove the panel from public reachability, enforce MFA, and rotate any default credentials.
  tags: [admin, default-creds]
requests:
  - method: GET
    path: '{{BaseURL}}/admin'
    matchers:
      - type: word
        part: body
        words:
          - 'type="password"'
      - type: word
        part: body
        words:
          - 'admin'
          - 'administrator'
          - 'dashboard'
          - 'console'
        condition: or
      - type: status
        status: 200
    matchers-condition: and
