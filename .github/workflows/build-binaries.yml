name: build-binaries
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            artifact: summit-linux-amd64
            ext: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: summit-linux-arm64
            ext: ""
          - os: windows-latest
            target: windows-amd64
            artifact: summit-windows-amd64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Build binary
        shell: bash
        run: |
          pyinstaller --onefile --name summit-${{ matrix.target }} \
            --hidden-import=summit \
            --hidden-import=summit.cli \
            --hidden-import=summit.authorize \
            --hidden-import=summit.race \
            --hidden-import=summit.tls \
            --hidden-import=summit.ratelimit \
            --hidden-import=summit.smart \
            --hidden-import=summit.waf \
            --hidden-import=summit.captcha \
            --hidden-import=summit.takeover \
            --hidden-import=summit.cve \
            --hidden-import=summit.graphql \
            --hidden-import=summit.openapi \
            --hidden-import=summit.paramminer \
            --hidden-import=summit.recon \
            --hidden-import=summit.toolkit \
            --hidden-import=summit.updates \
            --hidden-import=summit.http.client \
            --hidden-import=summit.http.models \
            --hidden-import=summit.crawl.spider \
            --hidden-import=summit.crawl.js_endpoints \
            --hidden-import=summit.scan.core \
            --hidden-import=summit.scan.engine \
            --hidden-import=summit.scan.passive \
            --hidden-import=summit.scan.linkcheck \
            --hidden-import=summit.report.writer \
            --hidden-import=summit.report.sarif \
            --hidden-import=summit.proxy.server \
            --hidden-import=summit.fuzz.dirbuster \
            -m summit.cli
      - name: Verify binary exists
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/summit-${{ matrix.target }}${{ matrix.ext }}"
      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/summit-${{ matrix.target }}${{ matrix.ext }}
          asset_name: summit-${{ matrix.target }}${{ matrix.ext }}
